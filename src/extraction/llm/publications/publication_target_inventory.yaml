deferred_and_follow_on_cases:
- operational_case: Exact Paper→Repository role deferred by Phase B
  responsibility: hybrid
  treatment: deferred_resolution
  pilot_rule: LLM classifies hasCodeRepository/referencesRepository/unsupported; deterministic endpoint is reused.
- operational_case: Exact Paper→Tool role deferred by Phase B
  responsibility: hybrid
  treatment: deferred_resolution
  pilot_rule: LLM classifies usesTool/mentionsTool/unsupported; deterministic endpoint is reused.
- operational_case: Exact dataset or repository identifier omitted by Phase B
  responsibility: hybrid
  treatment: deferred_resolution
  pilot_rule: LLM locates and interprets; deterministic resolver validates, normalizes, and creates/reuses endpoint.
- operational_case: Availability identifier with ambiguous semantic role
  responsibility: hybrid
  treatment: deferred_resolution
  pilot_rule: Resolve only for pilot papers; allow remain_deferred, rejected, type_conflict, or unsupported_role.
- operational_case: Ambiguous or conflicting cited DOI type
  responsibility: hybrid
  treatment: separate_follow_on_protocol
  pilot_rule: Requires provider metadata, bibliographic resolution, and adjudication.
- operational_case: DOI-less citation grounding
  responsibility: hybrid
  treatment: separate_follow_on_protocol
  pilot_rule: Requires in-text anchor and reference-list resolution.
- operational_case: Typed citation grounding and citation intent
  responsibility: hybrid
  treatment: separate_follow_on_protocol
  pilot_rule: Requires citation-context semantics plus bibliographic endpoint resolution.
- operational_case: Fine-grained corrigendum targeting
  responsibility: hybrid
  treatment: separate_follow_on_protocol
  pilot_rule: Align corrected statement, Finding, Metric, Experiment, Parameter, or Conclusion with original paper.
- operational_case: Cross-source identity and consolidation
  responsibility: alignment_consolidation
  treatment: separate_follow_on_protocol
  pilot_rule: Global identity, versions, sameAs-like decisions, and cross-source implementation/documentation relations.
