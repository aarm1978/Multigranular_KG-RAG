contract_implementation_observations:
- id: OBS-PUB-005
  status: accepted_for_contract_implementation
  observation: Method usesModel and Method appliesTo may overlap
  pilot_rule: usesModel = model as component/resource; appliesTo = model as object of operation.
  implementation_requirement: Add matched positive/negative examples and adjudication rules; prohibit duplicate edges from
    the same evidence unless roles differ.
- id: OBS-PUB-007
  status: accepted_for_contract_implementation
  observation: mentionsVariable is weaker than the operational study-relevance criterion
  pilot_rule: Extract only variables observed, predicted, modeled, derived, compared, or analyzed by the current study.
  implementation_requirement: Freeze relevance criteria and prefer DataDescription as the local source when available.
- id: OBS-PUB-008
  status: accepted_for_contract_implementation
  observation: hasCodeRepository requires a reproducible ownership/association threshold
  pilot_rule: Use hasCodeRepository only for explicit associated implementation, source code, scripts, or reproducibility
    statements.
  implementation_requirement: Create positive, negative, and ambiguous examples; define precedence over referencesRepository.
- id: OBS-PUB-009
  status: accepted_for_contract_implementation
  observation: Compound and hybrid models lack a frozen typing policy
  pilot_rule: Decompose explicit components; type named composite entity by the best-supported concrete subtype; abstain when
    unsupported.
  implementation_requirement: Create adjudication examples for multi-component and multi-typed systems; prohibit abstract
    fallback.
- id: OBS-PUB-010
  status: accepted_for_contract_implementation
  observation: EvaluationMetric conflates metric type and contextual metric occurrence
  pilot_rule: Create contextual metric occurrences distinguished by model, method, experiment, condition, and value.
  implementation_requirement: Freeze occurrence-level identity and local reconciliation rules.
- id: OBS-PUB-011
  status: accepted_for_contract_implementation
  observation: Parameter conflates parameter concept and contextual parameter setting
  pilot_rule: Create contextual Parameter instances distinguished by owner, configuration, range, and value.
  implementation_requirement: Freeze owner-aware identity and local reconciliation rules.
- id: OBS-PUB-015
  status: accepted_for_contract_implementation
  observation: No RepositoryMention class for unresolved repository names
  pilot_rule: Use a source-scoped provisional Repository candidate without global merge.
  implementation_requirement: Ensure candidate schema distinguishes provisional identity from exact Repository endpoints.
- id: OBS-PUB-022
  status: accepted_for_contract_implementation
  observation: Global ontology extraction labels can be confused with source-specific production responsibility
  pilot_rule: The publication inventory uses source_scope=publications and stage_scope=llm_semantic_overlay.
  implementation_requirement: Add an explicit note that ontology extraction metadata is global/descriptive, while production
    responsibility is source- and stage-specific.
- id: OBS-PUB-023
  status: accepted_for_contract_implementation
  observation: Asserted and inferred superclass or parent-property memberships need provenance separation
  pilot_rule: LLM emits the concrete class/specific property; pipeline derives ancestors or parent properties.
  implementation_requirement: Define assertedType versus inferredType and ensure derived assertions are not scored as LLM
    predictions.
- id: OBS-PUB-024
  status: accepted_for_contract_implementation
  observation: Use/mention/reference precedence must be enforced consistently
  pilot_rule: Use supersedes mention; formal dataset reference may coexist with use.
  implementation_requirement: Add candidate reconciliation and conflict-validation rules.
