global_rules:
  evidence: No supported evidence span means no accepted semantic assertion.
  node_edge_evidence_independence: true
  atomicity: one node = one atomic semantic unit
  identity_scope: source_local_within_paper
  local_reconciliation: same class and same meaning within one Paper may reconcile; distinct meanings remain separate
  global_consolidation_allowed: false
  same_as_allowed: false
  deterministic_mutation_allowed: false
  neo4j_writes_allowed: false
  abstract_class_direct_instantiation_allowed: false
  derived_assertions_scored_as_llm_predictions: false
  use_mention_reference_precedence:
    usesModel: supersedes mentionsModel for the same Paper-entity pair
    usesTool: supersedes mentionsTool for the same Paper-entity pair
    usesDataset: supersedes mentionsDataset for the same Paper-entity pair
    usesDataset_and_referencesDataset: may coexist
    hasCodeRepository: specific assertion; referencesRepository parent may be pipeline-derived
  metric_parameter_policy: contextual occurrences; preserve exact source strings and do not introduce unapproved numeric normalization
  forbidden_output_fields_or_behaviors:
  - sameAs
  - mergeWith
  - consolidatesTo
  - global canonical ID
  - invented external identifier
  - Neo4j internal ID
  - direct database write
  - mutation of deterministic output
  - direct instantiation of abstract classes
