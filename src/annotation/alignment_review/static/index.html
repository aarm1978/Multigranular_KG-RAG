<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alignment review · Study 2</title><link rel="stylesheet" href="/style.css">
<script defer src="/save_coordinator.js"></script><script defer src="/app.js"></script></head>
<body><header><div><strong>Alignment review</strong><span>Exploratory usability and workload pilot</span></div>
<nav><span id="progress"></span><button id="pause" hidden>Pause</button><button id="export">Export results</button></nav></header>
<section id="welcome"><h1>Researcher pilot</h1><p>Review identity groups, then directed relations, using the original source evidence. You can pause or leave a case unanswered.</p>
<button class="primary" id="resume" disabled>Start review</button></section>
<main hidden id="workspace"><article><p class="eyebrow" id="phase"></p><h1 id="hypothesis"></h1><p id="description"></p>
<div id="definition"></div><h2>Source evidence</h2><p id="counts"></p><div id="evidence"></div><div id="end">End of case evidence</div></article>
<aside><form id="form"><h2 id="question"></h2><fieldset><legend>Judgment</legend><div id="options"></div></fieldset>
<label for="problematic">Problematic occurrences <small>(optional)</small></label><input id="problematic" maxlength="300" placeholder="e.g. O2, O5">
<label for="comment">Comment <small>(optional)</small></label><textarea id="comment" rows="3" maxlength="2000"></textarea>
<div class="buttons"><button type="button" id="prev">Previous</button><button type="button" id="next" class="primary">Save &amp; Next</button></div>
<button type="button" id="clear">Clear judgment</button></form></aside></main>
<footer role="status" id="status"></footer></body></html>
